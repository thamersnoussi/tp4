<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Exercice 2 - Formulaire d'inscription</title>
</head>
<body>

    <form action="" method="post">
        <table >
            <tr>
                <td><label for="pseudo">Votre pseudo</label></td>
                <td><input type="text" id="pseudo" name="pseudo"></td>
            </tr>
            <tr>
                <td><label for="pass">Votre mot de passe</label></td>
                <td><input type="password" id="pass" name="pass"></td>
            </tr>
            <tr>
                <td><label for="pass_confirm">Ressaisir votre mot de passe</label></td>
                <td><input type="password" id="pass_confirm" name="pass_confirm"></td>
            </tr>
            <tr>
                <td valign="top"><label>OS préféré</label></td>
                <td>
                    <input type="radio" id="winxp" name="os" value="winxp">
                    <label for="winxp">Windows XP</label><br>
                    
                    <input type="radio" id="vista" name="os" value="vista">
                    <label for="vista">Windows Vista</label><br>
                    
                    <input type="radio" id="mac" name="os" value="mac">
                    <label for="mac">MacOSX</label><br>
                    
                    <input type="radio" id="linux" name="os" value="linux">
                    <label for="linux">Linux</label><br>
                    
                    <input type="radio" id="autre" name="os" value="autre">
                    <label for="autre">Autre</label>
                </td>
            </tr>
            <tr>
                <td valign="top"><label>Vous possédez</label></td>
                <td>
                    <input type="checkbox" id="bureau" name="equipement[]" value="bureau">
                    <label for="bureau">Un ordinateur de bureau</label><br>
                    
                    <input type="checkbox" id="portable" name="equipement[]" value="portable">
                    <label for="portable">Un portable</label><br>
                    
                    <input type="checkbox" id="netbook" name="equipement[]" value="netbook">
                    <label for="netbook">Un netbook</label><br>
                    
                    <input type="checkbox" id="tablette" name="equipement[]" value="tablette">
                    <label for="tablette">Une tablette (Pad)</label>
                </td>
            </tr>
            <tr>
                <td valign="top"><label for="profession">Votre profession</label></td>
                <td>
                    <select id="profession" name="profession" size="4">
                        <option value="chomeur">Chômeur</option>
                        <option value="etudiant">Etudiant</option>
                        <option value="fonctionnaire">Fonctionnaire</option>
                        <option value="prive">Privé</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="S'inscrire">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
